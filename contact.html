<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">📰 My News</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">หน้าแรก</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="contact.html">ติดต่อ</a>
        </li>
        <li class="nav-item" id="authNavItem">
          <a class="nav-link" href="login.html">Login</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">ผู้จัดทำ</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Header -->
<div class="hero">
  <h1>ติดต่อเรา</h1>
  <p>มีคำถามหรือข้อเสนอแนะ สามารถส่งข้อความหาเราได้</p>
</div>

<!-- Contact Form -->
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">

    <div class="col-md-6">
      <div class="contact-box">

        <h3 class="mb-4 text-center">📩 ส่งข้อความ</h3>

        <!-- เพิ่ม alert -->
        <form onsubmit="showAlert(event)">

          <div class="mb-3">
            <label class="form-label">ชื่อ</label>
            <input type="text" class="form-control" placeholder="กรอกชื่อของคุณ" required>
          </div>

          <div class="mb-3">
            <label class="form-label">อีเมล</label>
            <input type="email" class="form-control" placeholder="example@email.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">ข้อความ</label>
            <textarea class="form-control" rows="4" placeholder="พิมพ์ข้อความ..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">ส่งข้อความ</button>

        </form>

      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 My News</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function updateAuthMenu() {
    const authNavItem = document.getElementById("authNavItem");
    if (!authNavItem) return;
    const username = localStorage.getItem("myNewsUser");
    if (username) {
      authNavItem.innerHTML = `
        <span class="nav-link text-white">สวัสดี, ${username}</span>
        <a class="nav-link btn btn-outline-light btn-sm ms-2" href="#" onclick="logout(event)">Logout</a>`;
    } else {
      authNavItem.innerHTML = '<a class="nav-link" href="login.html">Login</a>';
    }
  }

  function logout(e) {
    if (e) e.preventDefault();
    localStorage.removeItem("myNewsUser");
    window.location.href = "login.html";
  }

  function showAlert(e) {
    e.preventDefault();
    alert("ส่งข้อความสำเร็จ!");
  }

  updateAuthMenu();
</script>

</body>
</html>
